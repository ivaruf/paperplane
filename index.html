<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Glider</title>
  <meta name="description" content="A browser homage to the classic Macintosh game Glider: steer a paper airplane through the rooms of a house.">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#2f6fd6">
  <meta name="application-name" content="Glider">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Glider">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- HUD ---------------------------------------------------------------- -->
  <header id="hud" class="hud">
    <div class="hud-left">
      <svg class="hud-icon hud-icon-glider" viewBox="0 0 32 20" aria-hidden="true" focusable="false">
        <polygon points="31,10 1,3 10,10" fill="#ffffff" stroke="#1a56c4" stroke-width="1.6" stroke-linejoin="round"/>
        <polygon points="31,10 10,10 1,17" fill="#e8eef8" stroke="#1a56c4" stroke-width="1.6" stroke-linejoin="round"/>
        <polygon points="31,10 10,10 12,14.5" fill="#cdd8ea" stroke="#1a56c4" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      <span id="hud-lives" class="hud-num" aria-label="Gliders left">0</span>
    </div>

    <div class="hud-center">
      <span id="hud-room" class="hud-room" aria-live="polite"></span>
    </div>

    <div class="hud-right">
      <span id="hud-helium" class="hud-chip hud-chip-helium" hidden title="Helium">
        <svg class="hud-chip-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <ellipse cx="12" cy="9" rx="7" ry="8" fill="#ff7aa2" stroke="#b83b62" stroke-width="1.5"/>
          <polygon points="10.5,16.5 13.5,16.5 12,19" fill="#b83b62"/>
          <path d="M12 19 q-2 2 0 4" fill="none" stroke="#b83b62" stroke-width="1.2"/>
        </svg>
        <span id="hud-helium-n">0s</span>
      </span>
      <span id="hud-boost" class="hud-chip hud-chip-boost" hidden title="Boost charges">
        <svg class="hud-chip-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <rect x="3" y="7" width="16" height="10" rx="2" fill="#ffd54a" stroke="#8a6d00" stroke-width="1.5"/>
          <rect x="19" y="10" width="2.5" height="4" rx="0.8" fill="#8a6d00"/>
          <polygon points="12,8.2 8.5,13 11.3,13 10,16.5 14,11.2 11.3,11.2" fill="#8a6d00"/>
        </svg>
        <span id="hud-boost-n">0</span>
      </span>
      <span id="hud-score" class="hud-num" aria-label="Score">0</span>
      <svg class="hud-icon hud-icon-star" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <polygon points="12,1.8 15,8.6 22.3,9.3 16.8,14.2 18.4,21.4 12,17.7 5.6,21.4 7.2,14.2 1.7,9.3 9,8.6"
                 fill="#f5b800" stroke="#c98f00" stroke-width="1.4" stroke-linejoin="round"/>
      </svg>
    </div>
  </header>

  <!-- STAGE -------------------------------------------------------------- -->
  <main id="stage-area" class="stage-area">
    <div id="stage" class="stage">
      <canvas id="game" aria-label="Glider playfield" role="img"></canvas>

      <!-- Touch controls: only the buttons receive pointer events -->
      <div id="touch-controls" class="touch-controls">
        <button type="button" id="touch-left" class="touch-btn touch-btn-left" data-input="left" tabindex="-1" aria-label="Steer left">
          <svg viewBox="0 0 60 80" aria-hidden="true" focusable="false"><polygon points="50,8 10,40 50,72"/></svg>
        </button>
        <button type="button" id="touch-right" class="touch-btn touch-btn-right" data-input="right" tabindex="-1" aria-label="Steer right">
          <svg viewBox="0 0 60 80" aria-hidden="true" focusable="false"><polygon points="10,8 50,40 10,72"/></svg>
        </button>
        <button type="button" id="touch-boost" class="touch-btn touch-btn-boost" data-input="boost" tabindex="-1" aria-label="Boost">
          <svg viewBox="0 0 40 30" aria-hidden="true" focusable="false"><polygon points="20,3 37,27 3,27"/></svg>
          <span class="touch-btn-label">boost</span>
        </button>
        <button type="button" id="touch-pause" class="touch-btn touch-btn-pause" data-action="pause" tabindex="-1" aria-label="Pause">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg>
        </button>
      </div>

      <!-- Overlay screens -->
      <div id="overlay" class="overlay" hidden>
        <div class="card" role="dialog" aria-label="Glider menu">

          <section id="screen-title" class="screen screen-title" hidden>
            <h1 class="wordmark-big">Glider</h1>
            <p id="title-subtitle" class="subtitle"></p>
            <p class="hint">Press <kbd>Enter</kbd> or tap Start</p>
            <p id="title-highscore" class="highscore" hidden></p>
            <div class="btn-row">
              <button type="button" class="btn" data-action="start" data-primary>Start</button>
              <button type="button" id="install-btn" class="btn btn-secondary" hidden>Install</button>
              <button type="button" class="btn btn-secondary btn-mute" data-action="mute" aria-pressed="false">
                <span class="mute-icon" aria-hidden="true">🔊</span> <span class="mute-text">Sound on</span>
              </button>
            </div>
            <ul class="legend" aria-label="Controls">
              <li><kbd>←</kbd> <kbd>→</kbd> steer</li>
              <li><kbd>↑</kbd> / <kbd>Space</kbd> boost</li>
              <li><kbd>P</kbd> / <kbd>Esc</kbd> pause</li>
              <li><kbd>M</kbd> mute</li>
            </ul>
          </section>

          <section id="screen-paused" class="screen screen-paused" hidden>
            <h2 class="screen-heading">Paused</h2>
            <div class="btn-row">
              <button type="button" class="btn" data-action="resume" data-primary>Resume</button>
              <button type="button" class="btn btn-secondary" data-action="restart">Restart</button>
            </div>
          </section>

          <section id="screen-gameover" class="screen screen-gameover" hidden>
            <h2 class="screen-heading">Out of gliders</h2>
            <p id="gameover-badge" class="badge" hidden>New high score!</p>
            <p class="score-line">Score <b id="gameover-score">0</b></p>
            <p class="score-line score-line-high">High score <b id="gameover-highscore">0</b></p>
            <div class="btn-row">
              <button type="button" class="btn" data-action="restart" data-primary>Play again</button>
            </div>
          </section>

          <section id="screen-win" class="screen screen-win" hidden>
            <h2 id="win-title" class="screen-heading">You made it!</h2>
            <p id="win-badge" class="badge" hidden>New high score!</p>
            <p class="score-line">Score <b id="win-score">0</b></p>
            <p class="score-line score-line-high">High score <b id="win-highscore">0</b></p>
            <div class="btn-row">
              <button type="button" class="btn" data-action="restart" data-primary>Play again</button>
            </div>
          </section>

        </div>
      </div>

      <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    </div>

    <p class="rotate-hint" aria-hidden="true">Rotate your device for a bigger view</p>
  </main>

  <!-- FOOTER ------------------------------------------------------------- -->
  <footer id="footer" class="footer">
    <div class="wordmark" aria-hidden="true">
      <span class="wordmark-title">Glider</span>
      <span class="wordmark-sub">homage</span>
    </div>
    <button type="button" id="mute-btn" class="mute-btn" data-action="mute" aria-label="Toggle sound" aria-pressed="false">
      <span class="mute-icon" aria-hidden="true">🔊</span>
    </button>
  </footer>

  <!-- Crash flash (fixed, fullscreen) -->
  <div id="flash" class="flash" aria-hidden="true" hidden></div>

  <noscript><p class="noscript">Glider needs JavaScript to run.</p></noscript>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/pwa.js"></script>
</body>
</html>
