<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Glider homage icon. Keep in sync with scripts/make-icons.mjs (same geometry). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a7be0"/>
      <stop offset="1" stop-color="#2559bd"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  <!-- paper airplane: unit-space polygons scaled to 78% and rotated 18° nose-up -->
  <g transform="rotate(-18 256 256) translate(56.32 56.32) scale(399.36)">
    <g opacity="0.22" fill="#000000" transform="translate(0.02 0.03)">
      <polygon points="0.96,0.50 0.06,0.24 0.30,0.50"/>
      <polygon points="0.96,0.50 0.30,0.50 0.06,0.76"/>
      <polygon points="0.96,0.50 0.30,0.50 0.36,0.70"/>
    </g>
    <polygon points="0.96,0.50 0.30,0.50 0.06,0.76" fill="#e9edf4"/>
    <polygon points="0.96,0.50 0.06,0.24 0.30,0.50" fill="#ffffff"/>
    <polygon points="0.96,0.50 0.30,0.50 0.36,0.70" fill="#cfd6e2"/>
    <line x1="0.93" y1="0.50" x2="0.31" y2="0.50" stroke="#b9c2d0" stroke-width="0.018" stroke-linecap="round"/>
  </g>
</svg>
